<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم - وصّلني</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1a1a2e;
    }

    header {
      background: #0A7C5C;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: white;
    }

    .pending { background: orange; }
    .done { background: green; }
    .cancel { background: red; }

    button {
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Cairo';
      font-weight: 600;
    }

    .accept { background: #0A7C5C; color: white; }
    .finish { background: #2196f3; color: white; }
    .delete { background: #e53935; color: white; }

    .small {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>

<header>🚑 لوحة تحكم وصّلني</header>

<div class="container" id="ridesContainer">
  جارٍ تحميل الطلبات...
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
    authDomain: "wassalni-fa958.firebaseapp.com",
    projectId: "wassalni-fa958",
    storageBucket: "wassalni-fa958.firebasestorage.app",
    messagingSenderId: "63888443959",
    appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const container = document.getElementById("ridesContainer");

  function statusBadge(status) {
    if (status === "pending") return `<span class="badge pending">قيد الانتظار</span>`;
    if (status === "done") return `<span class="badge done">مكتمل</span>`;
    if (status === "cancel") return `<span class="badge cancel">ملغي</span>`;
    return `<span class="badge">${status}</span>`;
  }

  onSnapshot(collection(db, "rides"), (snapshot) => {
    container.innerHTML = "";

    if (snapshot.empty) {
      container.innerHTML = "لا توجد طلبات حالياً";
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="row">
          <div>
            <b>${data.name}</b><br>
            <span class="small">📞 ${data.phone}</span>
          </div>

          ${statusBadge(data.status)}
        </div>

        <p class="small">📍 من: ${data.from}</p>
        <p class="small">🏥 إلى: ${data.to}</p>
        <p class="small">💰 السعر: ${data.price} أوقية</p>
        <p class="small">📏 المسافة: ${data.distance?.toFixed(1)} كم</p>

        <div class="row" style="margin-top:10px;">
          <button class="accept">قبول</button>
          <button class="finish">إنهاء</button>
          <button class="delete">حذف</button>
        </div>
      `;

      // أزرار التحكم
      div.querySelector(".accept").onclick = async () => {
        await updateDoc(doc(db, "rides", docSnap.id), {
          status: "pending"
        });
      };

      div.querySelector(".finish").onclick = async () => {
        await updateDoc(doc(db, "rides", docSnap.id), {
          status: "done"
        });
      };

      div.querySelector(".delete").onclick = async () => {
        await deleteDoc(doc(db, "rides", docSnap.id));
      };

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
