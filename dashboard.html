<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>وصّلني - لوحة التحكم</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-card h2 { color: #0A7C5C; font-size: 28px; margin-bottom: 10px; }
    .login-card p { color: #888; margin-bottom: 24px; }
    .login-card input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      text-align: center;
    }
    .login-card input:focus { border-color: #0A7C5C; }
    .login-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #login-error { color: red; margin-top: 12px; font-size: 14px; }
    header {
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 24px; font-weight: 800; }
    header button {
      color: white;
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .stats { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 24px 32px;
      flex: 1;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      border-right: 5px solid #0A7C5C;
    }
    .stat-card .number { font-size: 42px; font-weight: 800; color: #0A7C5C; }
    .stat-card .label { color: #888; font-size: 14px; margin-top: 4px; }
    .table-wrapper {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #0A7C5C; color: white; }
    thead th { padding: 16px 18px; text-align: right; font-size: 13px; }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:hover { background: #f8fffe; }
    tbody td { padding: 14px 18px; font-size: 14px; color: #444; text-align: right; }
    .badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #fff3cd;
      color: #856404;
    }
    .empty { text-align: center; padding: 60px; color: #bbb; font-size: 16px; }
    .section-title { color: #333; font-size: 20px; margin-bottom: 16px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h2>🔒 لوحة التحكم</h2>
      <p>أدخل كلمة المرور للدخول</p>
      <input type="password" id="passwordInput" placeholder="كلمة المرور">
      <button onclick="checkPassword()">دخول</button>
      <p id="login-error"></p>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="dashboard" style="display:none;">
    <header>
      <h1>🚗 وصّلني - لوحة التحكم</h1>
      <button onclick="logout()">خروج 🚪</button>
    </header>

    <div class="container">
      <div class="stats">
        <div class="stat-card">
          <div class="number" id="totalRides">0</div>
          <div class="label">إجمالي الطلبات</div>
        </div>
        <div class="stat-card">
          <div class="number" id="totalDrivers">0</div>
          <div class="label">إجمالي السائقين</div>
        </div>
      </div>

      <p class="section-title">📋 طلبات المرضى</p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الهاتف</th>
              <th>موقع الانطلاق</th>
              <th>الوجهة</th>
              <th>الحالة</th>
              <th>التاريخ</th>
            </tr>
          </thead>
          <tbody id="ridesTable">
            <tr><td colspan="6" class="empty">جارٍ التحميل...</td></tr>
          </tbody>
        </table>
      </div>

      <br>
      <p class="section-title">🚗 السائقون المسجلون</p>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>الهاتف</th>
              <th>نوع السيارة</th>
              <th>رقم اللوحة</th>
              <th>المنطقة</th>
            </tr>
          </thead>
          <tbody id="driversTable">
            <tr><td colspan="5" class="empty">جارٍ التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
      authDomain: "wassalni-fa958.firebaseapp.com",
      projectId: "wassalni-fa958",
      storageBucket: "wassalni-fa958.firebasestorage.app",
      messagingSenderId: "63888443959",
      appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "Wassalni@2024#";

    window.checkPassword = function() {
      const input = document.getElementById("passwordInput").value;
      if (input === ADMIN_PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadData();
      } else {
        document.getElementById("login-error").innerText = "❌ كلمة المرور خاطئة!";
      }
    }

    window.logout = function() {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
      document.getElementById("passwordInput").value = "";
    }

    async function loadData() {
      // تحميل الطلبات
      const ridesSnap = await getDocs(collection(db, "rides"));
      const ridesTable = document.getElementById("ridesTable");
      document.getElementById("totalRides").innerText = ridesSnap.size;

      if (ridesSnap.empty) {
        ridesTable.innerHTML = '<tr><td colspan="6" class="empty">لا توجد طلبات بعد</td></tr>';
      } else {
        ridesTable.innerHTML = "";
        ridesSnap.forEach(doc => {
          const r = doc.data();
          ridesTable.innerHTML += `<tr>
            <td>${r.name || "-"}</td>
            <td>${r.phone || "-"}</td>
            <td>${r.from || "-"}</td>
            <td>${r.to || "-"}</td>
            <td><span class="badge">${r.status || "pending"}</span></td>
            <td>${r.createdAt ? r.createdAt.substring(0,10) : "-"}</td>
          </tr>`;
        });
      }

      // تحميل السائقين
      const driversSnap = await getDocs(collection(db, "drivers"));
      const driversTable = document.getElementById("driversTable");
      document.getElementById("totalDrivers").innerText = driversSnap.size;

      if (driversSnap.empty) {
        driversTable.innerHTML = '<tr><td colspan="5" class="empty">لا يوجد سائقون بعد</td></tr>';
      } else {
        driversTable.innerHTML = "";
        driversSnap.forEach(doc => {
          const d = doc.data();
          driversTable.innerHTML += `<tr>
            <td>${d.name || "-"}</td>
            <td>${d.phone || "-"}</td>
            <td>${d.car_model || "-"}</td>
            <td>${d.plate || "-"}</td>
            <td>${d.area || "-"}</td>
          </tr>`;
        });
      }
    }
  </script>
</body>
</html>
