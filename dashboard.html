<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم - وصّلني</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #0A7C5C; --primary-dark: #065c43; --primary-light: #0d9e76;
      --red: #e53935; --blue: #1976d2; --orange: #f57c00;
      --gray: #f4f6f8; --text: #1a1a2e; --text-light: #6c757d;
    }
    body { font-family: 'Cairo', sans-serif; background: var(--gray); min-height: 100vh; color: var(--text); }

    /* ── شاشة الدخول ── */
    .login-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      background: white; border-radius: 24px; padding: 48px 36px;
      width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    .login-box h2 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .login-box p { color: var(--text-light); font-size: 13px; margin-bottom: 28px; }
    .login-box input {
      width: 100%; padding: 14px 16px; border: 2px solid #e8ecf0; border-radius: 12px;
      font-size: 15px; font-family: 'Cairo', sans-serif; outline: none; margin-bottom: 14px;
      text-align: center; transition: border-color 0.3s;
    }
    .login-box input:focus { border-color: var(--primary); }
    .login-box button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer;
    }
    #loginError { color: var(--red); font-size: 13px; margin-top: 10px; font-weight: 600; }

    /* ── هيدر ── */
    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .header-title { font-size: 20px; font-weight: 900; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .live-badge {
      background: rgba(255,255,255,0.15); padding: 5px 12px;
      border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e676; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }
    .logout-btn {
      background: rgba(255,255,255,0.2); color: white; border: none;
      padding: 8px 16px; border-radius: 10px;
      font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* ── إحصائيات ── */
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: white; border-radius: 16px; padding: 20px;
      text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      border-top: 4px solid var(--primary);
    }
    .stat-card.red   { border-top-color: var(--red); }
    .stat-card.blue  { border-top-color: var(--blue); }
    .stat-card.orange{ border-top-color: var(--orange); }
    .stat-value { font-size: 28px; font-weight: 900; color: var(--primary); }
    .stat-card.red   .stat-value { color: var(--red); }
    .stat-card.blue  .stat-value { color: var(--blue); }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }

    /* ── فلتر وبحث ── */
    .toolbar {
      display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      padding: 9px 18px; border-radius: 20px; border: 2px solid #e0e0e0;
      background: white; font-family: 'Cairo', sans-serif; font-size: 13px;
      font-weight: 600; color: var(--text-light); cursor: pointer; transition: all 0.3s;
    }
    .filter-btn.active {
      background: var(--primary); color: white; border-color: var(--primary);
    }
    .search-box {
      margin-right: auto; padding: 9px 16px; border: 2px solid #e0e0e0;
      border-radius: 20px; font-family: 'Cairo', sans-serif; font-size: 13px;
      outline: none; width: 220px; transition: border-color 0.3s;
    }
    .search-box:focus { border-color: var(--primary); }

    /* ── بطاقة الطلب ── */
    .ride-card {
      background: white; border-radius: 18px; padding: 20px 22px;
      margin-bottom: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      border-right: 5px solid #e0e0e0; transition: box-shadow 0.3s;
    }
    .ride-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
    .ride-card.pending  { border-right-color: var(--orange); }
    .ride-card.accepted { border-right-color: var(--blue); }
    .ride-card.done     { border-right-color: var(--primary); }
    .ride-card.cancel   { border-right-color: var(--red); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .client-info .client-name { font-size: 16px; font-weight: 700; }
    .client-info .client-phone { font-size: 13px; color: var(--text-light); margin-top: 2px; }
    .badge {
      padding: 5px 12px; border-radius: 20px; font-size: 12px;
      font-weight: 700; color: white;
    }
    .badge.pending  { background: var(--orange); }
    .badge.accepted { background: var(--blue); }
    .badge.done     { background: var(--primary); }
    .badge.cancel   { background: var(--red); }

    .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .info-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .info-item .label { color: var(--text-light); }
    .info-item .value { font-weight: 600; color: var(--text); }
    .map-link { color: var(--primary); font-weight: 700; text-decoration: none; font-size: 13px; }

    .driver-assign {
      background: #f8f9fa; border-radius: 10px; padding: 10px 14px;
      margin-bottom: 14px; font-size: 13px; display: flex; align-items: center; gap: 8px;
    }
    .driver-assign select {
      flex: 1; padding: 6px 10px; border: 1px solid #e0e0e0; border-radius: 8px;
      font-family: 'Cairo', sans-serif; font-size: 13px; outline: none;
    }
    .assign-btn {
      padding: 7px 14px; background: var(--primary); color: white; border: none;
      border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 13px;
      font-weight: 700; cursor: pointer;
    }

    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 9px 16px; border-radius: 10px; border: none;
      font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.3s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-accept  { background: #e8f5e9; color: var(--primary); }
    .btn-finish  { background: #e3f2fd; color: var(--blue); }
    .btn-cancel  { background: #ffebee; color: var(--red); }
    .btn-delete  { background: #fce4ec; color: #c62828; }
    .btn-wa      { background: #e8f5e9; color: #128C7E; }

    .date-text { font-size: 11px; color: var(--text-light); margin-top: 10px; }

    .empty { text-align: center; padding: 60px 20px; color: #bbb; font-size: 15px; }
    .empty-icon { font-size: 48px; display: block; margin-bottom: 12px; }

    @media(max-width:600px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .card-body  { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── شاشة تسجيل الدخول ── -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div style="font-size:48px;margin-bottom:12px">🚑</div>
    <h2>لوحة تحكم وصّلني</h2>
    <p>للأدمن فقط - أدخل بياناتك للدخول</p>
    <input type="email"    id="adminEmail"    placeholder="البريد الإلكتروني">
    <input type="password" id="adminPassword" placeholder="كلمة المرور">
    <button onclick="adminLogin()">دخول 🔐</button>
    <p id="loginError"></p>
  </div>
</div>

<!-- ── لوحة التحكم ── -->
<div id="mainDashboard" style="display:none">

  <header>
    <div class="header-title">🚑 لوحة تحكم وصّلني</div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span> مباشر</div>
      <button class="logout-btn" onclick="adminLogout()">خروج</button>
    </div>
  </header>

  <div class="container">

    <!-- إحصائيات -->
    <div class="stats-grid">
      <div class="stat-card orange">
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">⏳ قيد الانتظار</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-value" id="statAccepted">0</div>
        <div class="stat-label">🚗 جارٍ التنفيذ</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statDone">0</div>
        <div class="stat-label">✅ مكتملة</div>
      </div>
      <div class="stat-card red">
        <div class="stat-value" id="statRevenue">0</div>
        <div class="stat-label">💰 إجمالي (أوقية)</div>
      </div>
    </div>

    <!-- فلتر -->
    <div class="toolbar">
      <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">⏳ انتظار</button>
      <button class="filter-btn" onclick="setFilter('accepted', this)">🚗 جارية</button>
      <button class="filter-btn" onclick="setFilter('done', this)">✅ مكتملة</button>
      <button class="filter-btn" onclick="setFilter('cancel', this)">❌ ملغاة</button>
      <input class="search-box" id="searchBox" placeholder="🔍 بحث بالاسم أو الهاتف..." oninput="renderRides()">
    </div>

    <div id="ridesContainer"><div class="empty"><span class="empty-icon">⏳</span>جارٍ التحميل...</div></div>

  </div>
</div>

<script type="module">
  import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
    authDomain: "wassalni-fa958.firebaseapp.com",
    projectId: "wassalni-fa958",
    storageBucket: "wassalni-fa958.firebasestorage.app",
    messagingSenderId: "63888443959",
    appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
  };

  const ADMIN_UID  = "RbDYeiTT7Ofg3dyBqRUcYZpTJ8Q2";
  const COMMISSION = 0.40;

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const auth = getAuth(app);

  let allRides   = [];
  let allDrivers = [];
  let currentFilter = "all";

  // ── تسجيل الدخول ──
  window.adminLogin = async function() {
    const email = document.getElementById("adminEmail").value.trim();
    const pass  = document.getElementById("adminPassword").value.trim();
    const errEl = document.getElementById("loginError");
    errEl.innerText = "";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch {
      errEl.innerText = "❌ البريد أو كلمة المرور غير صحيحة";
    }
  };

  window.adminLogout = async function() { await signOut(auth); };

  // ── حالة المصادقة ──
  onAuthStateChanged(auth, async (user) => {
    if (!user || user.uid !== ADMIN_UID) {
      document.getElementById("loginOverlay").style.display = "flex";
      document.getElementById("mainDashboard").style.display = "none";
      return;
    }
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("mainDashboard").style.display = "block";
    await loadDrivers();
    startLiveRides();
  });

  // ── تحميل السائقين ──
  async function loadDrivers() {
    const snap = await getDocs(collection(db, "drivers"));
    allDrivers = [];
    snap.forEach(d => allDrivers.push({ id: d.id, ...d.data() }));
  }

  // ── الطلبات (real-time) ──
  function startLiveRides() {
    onSnapshot(collection(db, "rides"), (snapshot) => {
      allRides = [];
      let pending=0, accepted=0, done=0, revenue=0;

      snapshot.forEach(d => {
        const r = { id: d.id, ...d.data() };
        allRides.push(r);
        if (r.status === "pending")  pending++;
        if (r.status === "accepted") accepted++;
        if (r.status === "done")     { done++; revenue += r.price || 0; }
      });

      // ترتيب تنازلي
      allRides.sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));

      document.getElementById("statPending").innerText  = pending;
      document.getElementById("statAccepted").innerText = accepted;
      document.getElementById("statDone").innerText     = done;
      document.getElementById("statRevenue").innerText  = revenue;

      renderRides();
    });
  }

  // ── فلتر ──
  window.setFilter = function(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderRides();
  };

  // ── عرض الطلبات ──
  window.renderRides = function() {
    const search = document.getElementById("searchBox").value.toLowerCase();
    const container = document.getElementById("ridesContainer");

    let rides = allRides.filter(r => {
      const matchFilter = currentFilter === "all" || r.status === currentFilter;
      const matchSearch = !search ||
        (r.name  || "").toLowerCase().includes(search) ||
        (r.phone || "").toLowerCase().includes(search);
      return matchFilter && matchSearch;
    });

    if (rides.length === 0) {
      container.innerHTML = `<div class="empty"><span class="empty-icon">📭</span>لا توجد طلبات</div>`;
      return;
    }

    container.innerHTML = "";
    rides.forEach(r => {
      const div = document.createElement("div");
      div.className = `ride-card ${r.status || "pending"}`;

      const badgeText = { pending:"⏳ انتظار", accepted:"🚗 جارية", done:"✅ مكتملة", cancel:"❌ ملغاة" };
      const date      = r.createdAt ? new Date(r.createdAt).toLocaleString("ar-EG") : "";
      const mapLink   = r.lat ? `https://maps.google.com/?q=${r.lat},${r.lng}` : null;
      const commission= Math.round((r.price||0) * COMMISSION);
      const profit    = (r.price||0) - commission;

      // قائمة السائقين
      const driverOptions = allDrivers
        .map(d => `<option value="${d.phone}" ${r.driver_phone===d.phone?"selected":""}>${d.name} (${d.phone})</option>`)
        .join("");

      div.innerHTML = `
        <div class="card-header">
          <div class="client-info">
            <div class="client-name">👤 ${r.name || "-"}</div>
            <div class="client-phone">📞 ${r.phone || "-"}</div>
          </div>
          <span class="badge ${r.status || "pending"}">${badgeText[r.status] || r.status}</span>
        </div>

        <div class="card-body">
          <div class="info-item">📍 <span class="label">من:</span> <span class="value">${r.from || "-"}</span></div>
          <div class="info-item">🏥 <span class="label">إلى:</span> <span class="value">${r.to || "-"}</span></div>
          <div class="info-item">💰 <span class="label">السعر:</span> <span class="value">${r.price || 0} أوقية</span></div>
          <div class="info-item">📏 <span class="label">المسافة:</span> <span class="value">${r.distance ? r.distance.toFixed(1)+" كم" : "-"}</span></div>
          <div class="info-item">🤝 <span class="label">عمولة:</span> <span class="value">${commission} | ربح السائق: ${profit}</span></div>
          ${r.driver_name ? `<div class="info-item">🚗 <span class="label">السائق:</span> <span class="value">${r.driver_name}</span></div>` : ""}
          ${mapLink ? `<div class="info-item">🗺️ <a class="map-link" href="${mapLink}" target="_blank">عرض الموقع</a></div>` : ""}
        </div>

        ${r.status === "pending" ? `
        <div class="driver-assign">
          <span>تعيين سائق:</span>
          <select id="drv_${r.id}">${driverOptions}</select>
          <button class="assign-btn" onclick="assignDriver('${r.id}')">تعيين</button>
        </div>` : ""}

        <div class="card-actions">
          ${r.status === "pending"  ? `<button class="btn btn-accept"  onclick="updateStatus('${r.id}','accepted')">✅ قبول</button>` : ""}
          ${r.status === "accepted" ? `<button class="btn btn-finish"  onclick="updateStatus('${r.id}','done')">🏁 إنهاء</button>` : ""}
          ${r.status !== "cancel" && r.status !== "done" ? `<button class="btn btn-cancel"  onclick="updateStatus('${r.id}','cancel')">❌ إلغاء</button>` : ""}
          ${r.phone ? `<a class="btn btn-wa" href="https://wa.me/${r.phone}" target="_blank">💬 واتساب</a>` : ""}
          <button class="btn btn-delete" onclick="deleteRide('${r.id}')">🗑️ حذف</button>
        </div>
        <div class="date-text">${date}</div>
      `;
      container.appendChild(div);
    });
  };

  // ── تعيين سائق ──
  window.assignDriver = async function(rideId) {
    const sel    = document.getElementById(`drv_${rideId}`);
    const phone  = sel.value;
    const driver = allDrivers.find(d => d.phone === phone);
    if (!driver) return;
    await updateDoc(doc(db, "rides", rideId), {
      driver_phone:   driver.phone,
      driver_name:    driver.name,
      driver_doc_id:  driver.id,
      assignedAt: new Date().toISOString()
    });
    alert(`✅ تم تعيين السائق ${driver.name}`);
  };

  // ── تحديث الحالة ──
  window.updateStatus = async function(rideId, status) {
    await updateDoc(doc(db, "rides", rideId), {
      status,
      updatedAt: new Date().toISOString()
    });
  };

  // ── حذف ──
  window.deleteRide = async function(rideId) {
    if (!confirm("هل أنت متأكد من حذف هذا الطلب؟")) return;
    await deleteDoc(doc(db, "rides", rideId));
  };
</script>

</body>
</html>
