<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - وصّلني</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding-top: 80px;
      background: #f5f5f5;
    }

    input {
      padding: 12px;
      width: 250px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      background: #0A7C5C;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #msg {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>تسجيل الدخول - وصّلني</h2>

<input id="email" placeholder="الإيميل">
<br>
<input id="password" type="password" placeholder="كلمة المرور">
<br><br>

<button onclick="login()">دخول</button>
<button onclick="register()">تسجيل جديد</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
  authDomain: "wassalni-fa958.firebaseapp.com",
  projectId: "wassalni-fa958",
  appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔐 تسجيل الدخول
window.login = async function () {

  const emailValue = document.getElementById("email").value;
  const passwordValue = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, emailValue, passwordValue);
    window.location.href = "index.html";
  } catch (e) {
    document.getElementById("msg").innerText = "خطأ في تسجيل الدخول";
  }
};

// 🆕 إنشاء حساب
window.register = async function () {

  const emailValue = document.getElementById("email").value;
  const passwordValue = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth, emailValue, passwordValue);
    window.location.href = "index.html";
  } catch (e) {
    document.getElementById("msg").innerText = "خطأ في إنشاء الحساب";
  }
};

</script>

</body>
</html>
