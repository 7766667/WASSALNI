<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
</head>

<body style="text-align:center;padding-top:80px;font-family:Arial;">

<h2>تسجيل الدخول</h2>

<input id="email" placeholder="الإيميل"><br><br>
<input id="password" type="password" placeholder="كلمة المرور"><br><br>

<button onclick="login()">دخول</button>
<button onclick="register()">تسجيل</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
  authDomain: "wassalni-fa958.firebaseapp.com",
  projectId: "wassalni-fa958"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔐 login
window.login = async function() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth,email,password);
    window.location.href="index.html";
  } catch(e) {
    document.getElementById("msg").innerText="خطأ";
  }
}

// 🆕 register
window.register = async function() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await createUserWithEmailAndPassword(auth,email,password);
    window.location.href="index.html";
  } catch(e) {
    document.getElementById("msg").innerText="خطأ";
  }
}

</script>

</body>
</html>
