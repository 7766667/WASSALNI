<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
</head>

<body style="font-family:Arial;text-align:center;padding-top:80px;">

<h2>تسجيل الدخول - وصّلني</h2>

<input id="email" placeholder="الإيميل"><br><br>
<input id="password" type="password" placeholder="كلمة المرور"><br><br>

<button onclick="login()">دخول</button>
<button onclick="register()">تسجيل جديد</button>

<p id="msg"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
  authDomain: "wassalni-fa958.firebaseapp.com",
  projectId: "wassalni-fa958",
  appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function () {
  try {
    const email = email.value;
    const password = password.value;

    await signInWithEmailAndPassword(auth, email, password);

    window.location.href = "index.html";

  } catch (e) {
    msg.innerText = "خطأ في تسجيل الدخول";
  }
}

window.register = async function () {
  try {
    const email = email.value;
    const password = password.value;

    await createUserWithEmailAndPassword(auth, email, password);

    window.location.href = "index.html";

  } catch (e) {
    msg.innerText = "خطأ في إنشاء الحساب";
  }
}

</script>

</body>
</html>
