<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 22px; font-weight: 800; }
    header button {
      color: white;
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    .live-badge {
      display: inline-block;
      background: #00c853;
      color: white;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      margin-right: 10px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }
    .login-card {

      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-card h2 { color: #1a1a2e; font-size: 26px; margin-bottom: 10px; }
    .login-card p { color: #888; margin-bottom: 24px; }
    .login-card input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
      text-align: center;
    }
    .login-card input:focus { border-color: #1a1a2e; }
    .login-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #login-error { color: red; margin-top: 12px; font-size: 14px; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .page-title { color: #333; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
    .ride-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-right: 5px solid #0A7C5C;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ride-card h3 { color: #1a1a2e; font-size: 18px; margin-bottom: 12px; }
    .ride-info { color: #555; font-size: 15px; margin-bottom: 8px; }
    .ride-info span { font-weight: bold; color: #333; }

      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-map {

      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
