<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصّلني - لوحة السائق</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --primary-light: #16213e; --accent: #0A7C5C; --accent-light: #0d9e76; --gray: #f0f4f8; --text: #1a1a2e; --text-light: #6c757d; }
    body { font-family: 'Cairo', sans-serif; background: var(--gray); min-height: 100vh; }

    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--primary-light)); padding: 20px; }
    .login-card { background: white; border-radius: 28px; padding: 48px 36px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
    .login-logo { font-size: 52px; margin-bottom: 8px; }
    .login-card h2 { font-size: 26px; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
    .login-card p { color: var(--text-light); font-size: 14px; margin-bottom: 28px; }
    .login-input { width: 100%; padding: 14px 16px; border: 2px solid #e8ecf0; border-radius: 12px; font-size: 15px; font-family: 'Cairo', sans-serif; outline: none; color: var(--text); margin-bottom: 14px; transition: all 0.3s; background: #fafafa; text-align: center; }
    .login-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; }

    header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }

    .container { max-width: 700px; margin: 24px auto; padding: 0 16px; }

    .balance-card { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 20px; padding: 24px; margin-bottom: 20px; color: white; display: flex; justify-content: space-between; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: white; border-radius: 14px; padding: 6px; }

    .tab-btn { flex: 1; padding: 11px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .tab-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }

    .ride-card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

    .history-card { background: white; border-radius: 18px; padding: 20px; margin-bottom: 12px; }

    .driver-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .driver-stat { background: white; padding: 16px; text-align: center; border-radius: 14px; }

    .empty { text-align: center; padding: 60px 20px; color: #bbb; }
  </style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🚙</div>
    <h2>لوحة السائق</h2>
    <input class="login-input" id="phoneInput" placeholder="رقم الهاتف">
    <input class="login-input" id="passwordInput" type="password" placeholder="كلمة المرور">
    <button class="login-btn" id="loginBtn">دخول</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="driverDashboard" style="display:none;">

<header>
  <div>🚙 وصّلني</div>
  <button id="logoutBtn">خروج</button>
</header>

<div class="container">

  <div class="balance-card">
    <div>
      <div>رصيدك</div>
      <div id="balanceAmount">---</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabRides">الطلبات</button>
    <button class="tab-btn" id="tabHistory">السجل</button>
  </div>

  <div id="tab-rides">
    <div id="ridesList" class="empty">جارٍ التحميل...</div>
  </div>

  <div id="tab-history" style="display:none;">
    
    <div class="driver-stats">
      <div class="driver-stat"><div id="statTotal">0</div><div>رحلات</div></div>
      <div class="driver-stat"><div id="statEarned">0</div><div>أرباح</div></div>
      <div class="driver-stat"><div id="statCommission">0</div><div>عمولة</div></div>
    </div>

    <div id="historyList" class="empty">جارٍ التحميل...</div>

  </div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX"
});

const db = getFirestore(app);
const auth = getAuth(app);

const COMMISSION = 0.40;

let currentDriverPhone = "";
let currentDriverDocId = "";
let currentBalance = 0;

let unsubscribe = null;

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  const phone = document.getElementById("phoneInput").value;
  const pass = document.getElementById("passwordInput").value;

  try {
    await signInWithEmailAndPassword(auth, phone+"@wassalni.com", pass);
  } catch {
    document.getElementById("login-error").innerText = "خطأ في الدخول";
  }
};

/* AUTH */
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  const q = query(collection(db, "drivers"), where("uid","==",user.uid));
  const snap = await getDocs(q);

  if (!snap.empty) {
    currentDriverPhone = snap.docs[0].data().phone;
    currentBalance = snap.docs[0].data().balance || 0;
    currentDriverDocId = snap.docs[0].id;
  }

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("driverDashboard").style.display = "block";

  startLiveRides();
});

/* TAB */
document.getElementById("tabHistory").onclick = () => {
  document.getElementById("tab-history").style.display = "block";
  document.getElementById("tab-rides").style.display = "none";
  loadHistory();
};

/* ❌ FIXED LOAD HISTORY */
async function loadHistory() {

  const historyList = document.getElementById("historyList");
  historyList.innerHTML = '<div class="empty">جارٍ التحميل...</div>';

  const q = query(collection(db,"rides"), where("driver_phone","==",currentDriverPhone));
  const snap = await getDocs(q);

  if (snap.empty) {
    historyList.innerHTML = '<div class="empty">لا توجد رحلات</div>';
    return;
  }

  let total=0, earned=0, commission=0;

  const rides = [];
  snap.forEach(d => rides.push(d.data()));

  rides.sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));

  historyList.innerHTML = "";

  rides.forEach(r => {

    const price = r.price || 0;
    const c = Math.round(price * COMMISSION);
    const e = price - c;

    total++;
    earned += e;
    commission += c;

    historyList.innerHTML += `
      <div class="history-card">
        <div>👤 ${r.name||"-"}</div>
        <div>📍 ${r.from||"-"}</div>
        <div>🏥 ${r.to||"-"}</div>
        <div>💰 ${price} | عمولة ${c} | ربح ${e}</div>
      </div>
    `;
  });

  document.getElementById("statTotal").innerText = total;
  document.getElementById("statEarned").innerText = earned;
  document.getElementById("statCommission").innerText = commission;
}

/* LIVE RIDES (مختصر) */
function startLiveRides() {
  const q = query(collection(db,"rides"), where("status","in",["pending"]));

  unsubscribe = onSnapshot(q,(snap)=>{
    const list = document.getElementById("ridesList");

    if (snap.empty) {
      list.innerHTML = "لا يوجد طلبات";
      return;
    }

    list.innerHTML = "";

    snap.forEach(d=>{
      const r = d.data();

      list.innerHTML += `
        <div class="ride-card">
          <div>👤 ${r.name}</div>
          <div>📍 ${r.from}</div>
          <div>🏥 ${r.to}</div>
        </div>
      `;
    });
  });
}

</script>

</body>
</html>
