<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصّلني - تسجيل سائق</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #1a1a2e; --primary-light: #16213e; --accent: #0A7C5C; --gray: #f8f9fa; --text: #1a1a2e; --text-light: #6c757d; }
    body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 28px; padding: 40px 36px; width: 100%; max-width: 480px; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { font-size: 52px; display: block; margin-bottom: 8px; }
    .logo h1 { font-size: 26px; font-weight: 900; color: var(--primary); }
    .logo p { color: var(--text-light); font-size: 14px; margin-top: 4px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; }
    .input-group input {
      width: 100%; padding: 13px 44px 13px 14px; border: 2px solid #e8ecf0; border-radius: 12px;
      font-size: 15px; font-family: 'Cairo', sans-serif; outline: none; color: var(--text);
      transition: all 0.3s; background: #fafafa;
    }
    .input-group input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 4px rgba(10,124,92,0.1); }
    .input-group input::placeholder { color: #b0bec5; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider span { font-size: 12px; color: var(--text-light); white-space: nowrap; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e8ecf0; }
    .submit-btn {
      width: 100%; padding: 15px; background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: 700;
      font-family: 'Cairo', sans-serif; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(26,26,46,0.3); margin-top: 8px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26,26,46,0.4); }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    #msg { text-align: center; margin-top: 14px; font-size: 14px; font-weight: 600; min-height: 24px; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
    .loading { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🚙</span>
      <h1>تسجيل سائق جديد</h1>
      <p>انضم لفريق وصّلني وابدأ في كسب المال</p>
    </div>

    <div class="divider"><span>معلوماتك الشخصية</span></div>

    <div class="input-group">
      <label>الاسم الكامل</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input id="name" type="text" placeholder="أدخل اسمك الكامل">
      </div>
    </div>
    <div class="input-group">
      <label>رقم الهاتف</label>
      <div class="input-wrapper">
        <span class="input-icon">📞</span>
        <input id="phone" type="tel" placeholder="أدخل رقم هاتفك">
      </div>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <div class="input-wrapper">
        <span class="input-icon">🔑</span>
        <input id="password" type="password" placeholder="6 أحرف على الأقل">
      </div>
    </div>

    <div class="divider"><span>معلومات السيارة</span></div>

    <div class="input-group">
      <label>نوع السيارة</label>
      <div class="input-wrapper">
        <span class="input-icon">🚗</span>
        <input id="car_model" type="text" placeholder="مثال: تويوتا كورولا">
      </div>
    </div>
    <div class="input-group">
      <label>رقم اللوحة</label>
      <div class="input-wrapper">
        <span class="input-icon">🔢</span>
        <input id="plate" type="text" placeholder="رقم لوحة السيارة">
      </div>
    </div>
    <div class="input-group">
      <label>منطقتك / حيّك</label>
      <div class="input-wrapper">
        <span class="input-icon">📍</span>
        <input id="area" type="text" placeholder="الحي أو المنطقة">
      </div>
    </div>

    <button class="submit-btn" id="registerBtn">تسجيل الآن 🚀</button>
    <p id="msg"></p>
    <div class="back-link">
      <a href="index.html">← العودة لصفحة الطلب</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
      authDomain: "wassalni-fa958.firebaseapp.com",
      projectId: "wassalni-fa958",
      storageBucket: "wassalni-fa958.firebasestorage.app",
      messagingSenderId: "63888443959",
      appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    document.getElementById("registerBtn").addEventListener("click", async () => {
      const name     = document.getElementById("name").value.trim();
      const phone    = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();
      const car_model= document.getElementById("car_model").value.trim();
      const plate    = document.getElementById("plate").value.trim();
      const area     = document.getElementById("area").value.trim();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("registerBtn");

      // ── التحقق من الحقول ──
      if (!name || !phone || !password || !car_model || !plate || !area) {
        msg.style.color = "#e53935";
        msg.innerText = "⚠️ الرجاء ملء جميع الحقول.";
        return;
      }
      if (password.length < 6) {
        msg.style.color = "#e53935";
        msg.innerText = "⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل.";
        return;
      }

      btn.innerHTML = '<span class="loading">⏳</span> جارٍ التسجيل...';
      btn.disabled = true;
      msg.innerText = "";

      try {
        // 1. إنشاء حساب Firebase Auth
        const email = `${phone}@wassalni.com`;
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCred.user.uid;

        // 2. حفظ بيانات السائق في Firestore
        const docRef = await addDoc(collection(db, "drivers"), {
          uid, name, phone, car_model, plate, area,
          balance: 0,
          isVerified: false,
          status: "available",
          registeredAt: new Date().toISOString()
        });

        // 3. حفظ بيانات الجلسة
        localStorage.setItem("driver_phone",  phone);
        localStorage.setItem("driver_name",   name);
        localStorage.setItem("driver_doc_id", docRef.id);
        localStorage.setItem("driver_uid",    uid);

        msg.style.color = "#0A7C5C";
        msg.innerText = "✅ تم التسجيل بنجاح! جارٍ نقلك...";
        setTimeout(() => { window.location.href = "driver-dashboard.html"; }, 1500);

      } catch (error) {
        btn.innerHTML = "تسجيل الآن 🚀";
        btn.disabled = false;
        msg.style.color = "#e53935";

        if (error.code === "auth/email-already-in-use") {
          msg.innerText = "⚠️ رقم الهاتف مسجل مسبقاً!";
        } else {
          msg.innerText = "❌ حدث خطأ: " + error.message;
        }
      }
    });
  </script>
</body>
</html>
