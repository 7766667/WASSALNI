<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>وصّلني - طلب توصيلة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { font-size: 32px; color: #0A7C5C; font-weight: 800; }
    .logo p { color: #888; font-size: 14px; margin-top: 4px; }
    .input-group { position: relative; margin-bottom: 16px; }
    .input-group span {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      color: #333;
      text-align: right;
    }
    .input-group input:focus { border-color: #0A7C5C; }
    .input-group input::placeholder { color: #aaa; }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { opacity: 0.92; }
    #msg { text-align: center; margin-top: 16px; font-size: 15px; font-weight: bold; min-height: 24px; }
    .dashboard-link { text-align: center; margin-top: 20px; }
    .dashboard-link a {
      color: #0A7C5C;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }
    .dashboard-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>🚗 وصّلني</h1>
      <p>خدمة النقل الطبي في موريتانيا</p>
    </div>
    <div class="input-group">
      <span>👤</span>
      <input id="name" type="text" placeholder="الاسم الكامل">
    </div>
    <div class="input-group">
      <span>📞</span>
      <input id="phone" type="tel" placeholder="رقم الهاتف">
    </div>
    <div class="input-group">
      <span>📍</span>
      <input id="from" type="text" placeholder="موقع الانطلاق">
    </div>
    <div class="input-group">
      <span>🏥</span>
      <input id="to" type="text" placeholder="الوجهة (المستشفى)">
    </div>
    <button onclick="sendRide()">إرسال الطلب 🚀</button>
    <p id="msg"></p>
    <div class="dashboard-link">
      <a href="dashboard.html">← عرض لوحة التحكم</a>
      <a href="driver-register.html">🚗 هل أنت سائق؟ سجّل هنا</a>
      <a href="driver-dashboard.html">🚙 دخول السائقين</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
      authDomain: "wassalni-fa958.firebaseapp.com",
      projectId: "wassalni-fa958",
      storageBucket: "wassalni-fa958.firebasestorage.app",
      messagingSenderId: "63888443959",
      appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.sendRide = async function() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const msg = document.getElementById("msg");

      if (!name || !phone || !from || !to) {
        msg.style.color = "red";
        msg.innerText = "الرجاء ملء جميع الحقول.";
        return;
      }

      try {
        await addDoc(collection(db, "rides"), {
          name, phone, from, to,
          status: "pending",
          createdAt: new Date().toISOString()
        });
        msg.style.color = "#0A7C5C";
        msg.innerText = "تم إرسال الطلب بنجاح! ✅";
        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("from").value = "";
        document.getElementById("to").value = "";
      } catch (error) {
        msg.style.color = "red";
        msg.innerText = "حدث خطأ، حاول مرة أخرى.";
      }
    }
  </script>
</body>
</html>
