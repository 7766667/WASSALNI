<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>وصّلني - طلب توصيلة</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .card {
      background:white;
      padding:30px;
      border-radius:15px;
      width:350px;
      text-align:center;
    }

    input, button {
      width:100%;
      padding:10px;
      margin:5px 0;
    }

    button {
      background:#0A7C5C;
      color:white;
      border:none;
      cursor:pointer;
    }

    #msg { margin-top:10px; font-weight:bold; }

  </style>
</head>

<body>

<div class="card">

  <h2 onclick="secretClick()">🚗 وصّلني</h2>

  <input id="name" placeholder="الاسم">
  <input id="phone" placeholder="الهاتف">
  <input id="from" placeholder="من">
  <input id="to" placeholder="إلى">

  <button onclick="sendRide()">إرسال الطلب</button>

  <p id="msg"></p>

  <br>
  <a href="login.html">تسجيل دخول</a>
  <br>
  <a href="driver-dashboard.html">لوحة السائق</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
  authDomain: "wassalni-fa958.firebaseapp.com",
  projectId: "wassalni-fa958"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user = null;

onAuthStateChanged(auth, (u) => {
  user = u;
  if (!user) window.location.href = "login.html";
});

// 🚗 إرسال الطلب
window.sendRide = async function() {

  if (!user) return;

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;

  try {
    await addDoc(collection(db,"rides"),{
      userId:user.uid,
      name,phone,from,to,
      status:"pending",
      createdAt:Date.now()
    });

    document.getElementById("msg").innerText = "تم إرسال الطلب ✔";

  } catch(e) {
    document.getElementById("msg").innerText = "خطأ في الإرسال";
  }
};

// 🔥 سر لوحة التحكم
let count = 0;
let timer;

window.secretClick = function() {
  count++;
  clearTimeout(timer);

  timer = setTimeout(()=>count=0,3000);

  if(count>=5){
    count=0;
    window.location.href="admin.html";
  }
}

</script>

</body>
</html>
