<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>وصّلني - طلب توصيلة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 {
      font-size: 32px;
      color: #0A7C5C;
      font-weight: 800;
    }
    .logo p {
      color: #888;
      font-size: 14px;
      margin-top: 4px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0A7C5C, #0d9e76);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #msg {
      text-align: center;
      margin-top: 16px;
      font-weight: bold;
      min-height: 24px;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      display: block;
      margin-top: 10px;
      color: #0A7C5C;
      font-weight: bold;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">
    <h1>🚗 وصّلني</h1>
    <p>خدمة النقل الطبي في موريتانيا</p>
  </div>

  <div class="input-group">
    <input id="name" type="text" placeholder="الاسم الكامل">
  </div>

  <div class="input-group">
    <input id="phone" type="tel" placeholder="رقم الهاتف">
  </div>

  <div class="input-group">
    <input id="from" type="text" placeholder="موقع الانطلاق">
  </div>

  <div class="input-group">
    <input id="to" type="text" placeholder="الوجهة">
  </div>

  <button onclick="sendRide()">إرسال الطلب 🚀</button>

  <p id="msg"></p>

  <!-- 🔥 روابط السائقين -->
  <div class="links">
    <a href="driver-register.html">🚗 تسجيل سائق جديد</a>
    <a href="driver-dashboard.html">🚙 دخول السائقين</a>
  </div>

</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
    authDomain: "wassalni-fa958.firebaseapp.com",
    projectId: "wassalni-fa958",
    storageBucket: "wassalni-fa958.firebasestorage.app",
    messagingSenderId: "63888443959",
    appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;

  // 🔐 تسجيل الدخول الإجباري
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      currentUser = user;
    }
  });

  window.sendRide = async function () {

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;
    const msg = document.getElementById("msg");

    if (!currentUser) {
      msg.innerText = "يجب تسجيل الدخول أولاً";
      return;
    }

    if (!name || !phone || !from || !to) {
      msg.innerText = "املأ جميع الحقول";
      return;
    }

    try {
      await addDoc(collection(db, "rides"), {
        userId: currentUser.uid,
        name,
        phone,
        from,
        to,
        status: "pending",
        createdAt: new Date().toISOString()
      });

      msg.style.color = "green";
      msg.innerText = "تم إرسال الطلب بنجاح ✅";

    } catch (e) {
      msg.style.color = "red";
      msg.innerText = "حدث خطأ أثناء الإرسال";
    }
  };

</script>

</body>
</html>
