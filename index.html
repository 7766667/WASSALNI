<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصّلني - خدمة النقل الطبي</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --primary:#0A7C5C;
      --primary-dark:#065c43;
      --primary-light:#0d9e76;
      --gray:#f8f9fa;
      --text:#1a1a2e;
      --text-light:#6c757d;
    }

    body{
      font-family:'Cairo',sans-serif;
      background:var(--gray);
      color:var(--text);
    }

    .hero{
      background:linear-gradient(135deg,var(--primary-dark),var(--primary),var(--primary-light));
      padding:40px 20px 80px;
      text-align:center;
      color:white;
    }

    .hero-logo{
      font-size:55px;
      margin-bottom:10px;
      cursor:pointer;
      user-select:none;
    }

    .hero h1{
      font-size:38px;
      font-weight:900;
    }

    .hero p{
      margin-top:8px;
      opacity:.9;
    }

    .hero-badge{
      display:inline-block;
      margin-top:14px;
      background:rgba(255,255,255,.15);
      padding:8px 18px;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.25);
    }

    .main-card{
      max-width:500px;
      margin:-40px auto 30px;
      padding:0 16px;
    }

    .card{
      background:white;
      border-radius:22px;
      padding:28px;
      box-shadow:0 10px 35px rgba(0,0,0,.1);
    }

    .card-title{
      color:var(--primary);
      font-size:20px;
      font-weight:700;
      margin-bottom:25px;
    }

    .input-group{
      margin-bottom:16px;
    }

    .input-group label{
      display:block;
      margin-bottom:6px;
      color:var(--text-light);
      font-size:14px;
      font-weight:600;
    }

    .input-wrapper{
      position:relative;
    }

    .input-icon{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      font-size:18px;
    }

    .input-group input{
      width:100%;
      padding:14px 45px 14px 14px;
      border:2px solid #e5e7eb;
      border-radius:12px;
      font-family:'Cairo',sans-serif;
      font-size:15px;
      outline:none;
    }

    .input-group input:focus{
      border-color:var(--primary);
    }

    .location-row{
      display:flex;
      gap:8px;
    }

    .locate-btn{
      background:linear-gradient(135deg,var(--primary),var(--primary-light));
      border:none;
      color:white;
      border-radius:12px;
      padding:0 18px;
      cursor:pointer;
      font-size:20px;
    }

    #map{
      width:100%;
      height:180px;
      margin-top:10px;
      border:none;
      border-radius:12px;
      display:none;
    }

    .price-card{
      display:none;
      margin-bottom:20px;
      background:linear-gradient(135deg,var(--primary),var(--primary-light));
      color:white;
      padding:20px;
      border-radius:16px;
    }

    .price-amount{
      font-size:30px;
      font-weight:900;
    }

    .submit-btn{
      width:100%;
      border:none;
      background:linear-gradient(135deg,var(--primary-dark),var(--primary-light));
      color:white;
      padding:16px;
      border-radius:14px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }

    #msg{
      text-align:center;
      margin-top:15px;
      font-weight:700;
    }

    .driver-section{
      max-width:500px;
      margin:auto;
      padding:0 16px 30px;
    }

    .driver-card{
      background:white;
      border-radius:20px;
      padding:24px;
      text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    .whatsapp-btn{
      display:block;
      text-decoration:none;
      background:linear-gradient(135deg,#25D366,#128C7E);
      color:white;
      padding:15px;
      border-radius:14px;
      font-weight:700;
      margin-top:20px;
      margin-bottom:12px;
    }

    .driver-login-btn{
      text-decoration:none;
      color:var(--primary);
      font-weight:700;
    }

    footer{
      text-align:center;
      padding:25px;
      color:var(--text-light);
      font-size:13px;
    }
  </style>
</head>

<body>

  <!-- الهيدر -->
  <div class="hero">

    <!-- 🚗 السيارة السرية -->
    <div class="hero-logo" id="secretCar">🚗</div>

    <h1>وصّلني</h1>

    <p>خدمة النقل الطبي في موريتانيا</p>

    <div class="hero-badge">
      🟢 متاح الآن · انواكشوط
    </div>

  </div>

  <!-- نموذج الطلب -->
  <div class="main-card">

    <div class="card">

      <div class="card-title">
        🚀 اطلب توصيلة
      </div>

      <div class="input-group">
        <label>الاسم الكامل</label>

        <div class="input-wrapper">
          <span class="input-icon">👤</span>

          <input id="name" type="text" placeholder="أدخل اسمك الكامل">
        </div>
      </div>

      <div class="input-group">
        <label>رقم الهاتف</label>

        <div class="input-wrapper">
          <span class="input-icon">📞</span>

          <input id="phone" type="tel" placeholder="أدخل رقم هاتفك">
        </div>
      </div>

      <div class="input-group">

        <label>موقع الانطلاق</label>

        <div class="location-row">

          <div class="input-wrapper" style="flex:1;">
            <span class="input-icon">📍</span>

            <input id="from" type="text" placeholder="موقعك الحالي">
          </div>

          <button class="locate-btn" onclick="getLocation()">
            🎯
          </button>

        </div>

        <iframe id="map"></iframe>

      </div>

      <div class="input-group">

        <label>الوجهة</label>

        <div class="input-wrapper">
          <span class="input-icon">🏥</span>

          <input id="to" type="text" placeholder="المستشفى أو العيادة" onchange="calculatePrice()">
        </div>

      </div>

      <div class="price-card" id="priceCard">

        <div>💰 السعر التقديري</div>

        <div class="price-amount" id="priceAmount">
          ---
        </div>

        <div id="priceDetails"></div>

      </div>

      <button class="submit-btn" onclick="sendRide()">
        إرسال الطلب 🚀
      </button>

      <p id="msg"></p>

    </div>

  </div>

  <!-- قسم السائقين -->
  <div class="driver-section">

    <div class="driver-card">

      <h3>🚙 هل أنت سائق؟</h3>

      <p>
        انضم لفريق وصّلني وابدأ في كسب المال.
      </p>

      <a class="whatsapp-btn"
         href="https://wa.me/22249841300"
         target="_blank">

        تواصل على واتساب

      </a>

      <a class="driver-login-btn" href="driver-dashboard.html">
        ← دخول السائقين المسجلين
      </a>

    </div>

  </div>

  <footer>
    © 2026 وصّلني
  </footer>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAihGwDfen5b1SjtPmzL0aToigleyGt6rM",
  authDomain: "wassalni-fa958.firebaseapp.com",
  projectId: "wassalni-fa958",
  storageBucket: "wassalni-fa958.firebasestorage.app",
  messagingSenderId: "63888443959",
  appId: "1:63888443959:web:3a28bf29c34c1f951d0db2"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PRICE_PER_KM = 40;

    let userLat = null;
    let userLng = null;

    function getDistanceKm(lat1,lng1,lat2,lng2){

      const R = 6371;

      const dLat = (lat2-lat1) * Math.PI/180;
      const dLng = (lng2-lng1) * Math.PI/180;

      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLng/2) *
        Math.sin(dLng/2);

      return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }

    // تحديد الموقع
    window.getLocation = function(){

      if(!navigator.geolocation){
        alert("المتصفح لا يدعم GPS");
        return;
      }

      navigator.geolocation.getCurrentPosition((position)=>{

        userLat = position.coords.latitude;
        userLng = position.coords.longitude;

        document.getElementById("from").value =
          userLat + "," + userLng;

        const map = document.getElementById("map");

        map.style.display = "block";

        map.src =
          `https://maps.google.com/maps?q=${userLat},${userLng}&z=15&output=embed`;

      });

    }

    // حساب السعر
    window.calculatePrice = async function(){

      if(!userLat) return;

      const distance = 5;

      const price = distance * PRICE_PER_KM;

      document.getElementById("priceCard").style.display = "block";

      document.getElementById("priceAmount").innerText =
        price + " أوقية";

      document.getElementById("priceDetails").innerText =
        "📏 المسافة: " + distance + " كم";
    }

    // إرسال الطلب
    window.sendRide = async function(){

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const from = document.getElementById("from").value.trim();
      const to = document.getElementById("to").value.trim();

      const msg = document.getElementById("msg");

      if(!name || !phone || !from || !to){

        msg.style.color = "red";
        msg.innerText = "⚠️ الرجاء ملء جميع الحقول";

        return;
      }

      try{

        await addDoc(collection(db,"rides"),{
          name,
          phone,
          from,
          to,
          createdAt:new Date().toISOString()
        });

        msg.style.color = "green";

        msg.innerText =
          "✅ تم إرسال الطلب بنجاح";

      }catch(error){

        msg.style.color = "red";

        msg.innerText =
          "❌ حدث خطأ أثناء الإرسال";
      }

    }

    // 🚗 الدخول السري للوحة التحكم
    let carClickCount = 0;
    let carClickTimer;

    document
      .getElementById("secretCar")
      .addEventListener("click", () => {

        carClickCount++;

        clearTimeout(carClickTimer);

        carClickTimer = setTimeout(() => {
          carClickCount = 0;
        },3000);

        if(carClickCount >= 5){

          carClickCount = 0;

          window.location.href = "dashboard.html";
        }

      });

  </script>

</body>
</html>
